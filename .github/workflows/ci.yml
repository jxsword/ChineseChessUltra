name: CI

# 触发：main 分支推送 + 所有 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # Apple Silicon runner（M1 虚拟机）；构建产物为 macOS .app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 仓库现存 100+ 条 info 级 lint 未清，先只让 error/warning 卡门禁
      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 全量测试
        run: flutter test

      - name: 构建 macOS 应用（debug）
        run: flutter build macos --debug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-app
          path: build/macos/Build/Products/Debug/chinese_chess_ultra.app
          retention-days: 7
