name: CI

# 触发：main 分支推送 + 所有 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 分析 + 测试门禁：纯 Dart 层，跑一次即可，四个平台构建都依赖它
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 仓库现存 100+ 条 info 级 lint 未清，先只让 error/warning 卡门禁
      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 全量测试
        run: flutter test

  macos:
    # Apple Silicon runner（M1 虚拟机）；构建产物为 macOS .app
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 macOS 应用（debug）
        run: flutter build macos --debug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-app
          path: build/macos/Build/Products/Debug/chinese_chess_ultra.app
          retention-days: 7

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Windows 应用（debug）
        run: flutter build windows --debug

      # exe 必须与其 DLL、data 目录同目录才能运行，整个 Debug 目录打包上传
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-app
          path: build/windows/x64/runner/Debug/
          retention-days: 7

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Linux 应用（debug）
        run: flutter build linux --debug

      # 同样需要 bundle 目录下的二进制 + lib + data 才能运行
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-bundle
          path: build/linux/x64/debug/bundle/
          retention-days: 7

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      # debug 构建也需要签名，Gradle 的 AGP 要求 JDK 17+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Android APK（debug）
        run: flutter build apk --debug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
