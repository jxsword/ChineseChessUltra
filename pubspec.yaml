name: chinese_chess_ultra
description: 一款跨平台 (Windows / Android) 的中国象棋单机对弈应用，基于 Flutter + Riverpod + sqlite3。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.4.0

  # 持久化（直接使用 sqlite3，避免引入代码生成以让项目开箱即用）
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # 文件操作
  file_picker: ^8.0.7
  share_plus: ^12.0.2

  # 权限处理 (Android)
  permission_handler: ^11.3.1

  # 国际化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 代码生成（项目暂未使用 drift / riverpod_generator，按需启用）
  # build_runner: ^2.4.11
  # drift_dev: ^2.18.0
  # riverpod_generator: ^2.4.0
  # custom_lint: ^0.6.4
  # riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  
  # 资源文件配置
  assets:
    - assets/engines/
    - assets/puzzles/

